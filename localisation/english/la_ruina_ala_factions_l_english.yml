l_english:
 la_ruina_ala_montgomery:0 "Capitol Militia"
 la_ruina_ala_birmingham:0 "The Strike"
 la_ruina_ala_valley:0 "The Valley Authority"
 la_ruina_ala_wiregrass:0 "The Courthouse Ring"
 la_ruina_ala_mobile:0 "The Harbor"

 la_ruina_ala.1.t:0 "Who Holds Alabama"
 la_ruina_ala.1.d:0 "The seal is in Montgomery, the mills are in Birmingham, the dams are in the valley, the courthouses run the Wiregrass, and the harbor at Mobile still clears ships. The map says ANARCHY. It keeps saying that until one of them wins the state."
 la_ruina_ala.1.mgm:0 "Back the capitol militia."
 la_ruina_ala.1.bhm:0 "Back the strike."
 la_ruina_ala.1.tva:0 "Back the Valley Authority."
 la_ruina_ala.1.wrg:0 "Back the courthouse ring."
 la_ruina_ala.1.mob:0 "Back the harbor."

 la_ruina_ala_mgm_leader_desc:0 "The militia holds the capitol and the great seal, and calls that a government."
 la_ruina_ala_bhm_leader_desc:0 "The furnaces are cold. The people who kept them are the only authority Birmingham has."
 la_ruina_ala_tva_leader_desc:0 "The dams are still there, and so are the maps, the payrolls, and the keys."
 la_ruina_ala_wrg_leader_desc:0 "The judges, the sheriffs, and the cotton men never needed a capitol."
 la_ruina_ala_mob_leader_desc:0 "Ships still come in. Whoever clears them has Mobile."

 la_ruina_ala_mgm_seal:0 "The Seal"
 la_ruina_ala_mgm_seal_desc:0 "The capitol militia has the building and the great seal. That is the whole of their claim."
 la_ruina_ala.2.t:0 "The Seal"
 la_ruina_ala.2.d:0 "The militia has the capitol and the great seal. They say that is the government. Everyone else in the state says it is a building with a flag on it."
 la_ruina_ala.2.a:0 "The seal stays in Montgomery."

 la_ruina_ala_mgm_secure:0 "Hold the Capitol"
 la_ruina_ala_mgm_secure_desc:0 "The roads into Montgomery are closed to anyone who does not answer to the militia."
 la_ruina_ala.3.t:0 "Hold the Capitol"
 la_ruina_ala.3.d:0 "The counties around Montgomery have stopped arguing about who collects the taxes. They have not stopped arguing about anything else."
 la_ruina_ala.3.a:0 "Montgomery is held."

 la_ruina_ala_mgm_break:0 "Break Birmingham"
 la_ruina_ala_mgm_break_desc:0 "The strike committee wanted the mills to be the capital. The militia is going up the rail line."
 la_ruina_ala.4.t:0 "Break Birmingham"
 la_ruina_ala.4.d:0 "Birmingham's committee wanted the furnaces to decide the state. The militia went up the rail line, and the committee is done talking."
 la_ruina_ala.4.a:0 "The mills are quiet."

 la_ruina_ala_mgm_unify:0 "One Alabama"
 la_ruina_ala_mgm_unify_desc:0 "The seal is the only one left. The map can stop saying anarchy."
 la_ruina_ala.5.t:0 "The State of Alabama"
 la_ruina_ala.5.d:0 "The other four holds have stopped answering for themselves. The seal is the government. The name on the map is the State of Alabama."
 la_ruina_ala.5.a:0 "Alabama has a government."

 la_ruina_ala_mgm_claim:0 "The Seal Abroad"
 la_ruina_ala_mgm_claim_desc:0 "A state that can write its own name can write a claim on every state still sitting in anarchy."
 la_ruina_ala.6.t:0 "The Seal Abroad"
 la_ruina_ala.6.d:0 "The militia is not marching on the rest of the country. Not yet. The seal is the claim, and every black state on the map is still only anarchy."
 la_ruina_ala.6.a:0 "The claim is written."

 la_ruina_ala_bhm_mills:0 "The Mills"
 la_ruina_ala_bhm_mills_desc:0 "The furnaces are cold, and the men who kept them are not asking Montgomery for permission."
 la_ruina_ala.7.t:0 "The Mills"
 la_ruina_ala.7.d:0 "The furnaces are cold and the men who kept them are the only authority Birmingham has. They are not asking the capitol for permission."
 la_ruina_ala.7.a:0 "The committee speaks for the mills."

 la_ruina_ala_bhm_secure:0 "Hold the City"
 la_ruina_ala_bhm_secure_desc:0 "The mills, the rail yards, and the streets between them answer to the committee."
 la_ruina_ala.8.t:0 "Hold the City"
 la_ruina_ala.8.d:0 "The mills, the rail yards, and the streets between them answer to the strike committee. Birmingham is a city with one voice."
 la_ruina_ala.8.a:0 "Birmingham is held."

 la_ruina_ala_bhm_break:0 "Break Montgomery"
 la_ruina_ala_bhm_break_desc:0 "The capitol militia has a seal and a building. The committee has the steel."
 la_ruina_ala.9.t:0 "Break Montgomery"
 la_ruina_ala.9.d:0 "The capitol militia had a seal and a building. The committee has the steel, and the building is theirs now."
 la_ruina_ala.9.a:0 "The capitol has fallen."

 la_ruina_ala_bhm_unify:0 "One Alabama"
 la_ruina_ala_bhm_unify_desc:0 "The committee is the only authority left in the state. The map can take a real name."
 la_ruina_ala.10.t:0 "The State of Alabama"
 la_ruina_ala.10.d:0 "The holds have stopped answering for themselves. The mills speak for the state. The name on the map is the State of Alabama."
 la_ruina_ala.10.a:0 "Alabama has a government."

 la_ruina_ala_bhm_claim:0 "Steel for a Continent"
 la_ruina_ala_bhm_claim_desc:0 "A government that can run Birmingham can claim the plants from Pittsburgh to the Pacific."
 la_ruina_ala.11.t:0 "Steel for a Continent"
 la_ruina_ala.11.d:0 "The committee is not opening a war for the rest of America. The claim is the plants. Every state still named ANARCHY has mills, yards, or men who used to run them."
 la_ruina_ala.11.a:0 "The claim is written."

 la_ruina_ala_tva_authority:0 "The Authority"
 la_ruina_ala_tva_authority_desc:0 "The dams are still there. The people who ran them still have the maps, the payrolls, and the keys."
 la_ruina_ala.12.t:0 "The Authority"
 la_ruina_ala.12.d:0 "The dams are still there. The people who ran them still have the maps, the payrolls, and the keys. That is more government than anyone else in the valley has."
 la_ruina_ala.12.a:0 "The Authority keeps its name."

 la_ruina_ala_tva_secure:0 "Hold the Valley"
 la_ruina_ala_tva_secure_desc:0 "The river towns take the Authority's paper because the Authority keeps the lights on."
 la_ruina_ala.13.t:0 "Hold the Valley"
 la_ruina_ala.13.d:0 "The river towns take the Authority's paper because the lights stay on. That is enough of a government for the valley."
 la_ruina_ala.13.a:0 "The valley is held."

 la_ruina_ala_tva_break:0 "Break the Wiregrass"
 la_ruina_ala_tva_break_desc:0 "The county bosses ran the cotton belt as private counties. The Authority has the engineers."
 la_ruina_ala.14.t:0 "Break the Wiregrass"
 la_ruina_ala.14.d:0 "The county bosses ran the cotton belt like private counties. The Authority has the engineers, and the bosses have been told to go home."
 la_ruina_ala.14.a:0 "The courthouses are quiet."

 la_ruina_ala_tva_unify:0 "One Alabama"
 la_ruina_ala_tva_unify_desc:0 "The Authority's paper runs the whole state. The map can take a real name."
 la_ruina_ala.15.t:0 "The State of Alabama"
 la_ruina_ala.15.d:0 "The holds have stopped answering for themselves. The Authority's paper is the law. The name on the map is the State of Alabama."
 la_ruina_ala.15.a:0 "Alabama has a government."

 la_ruina_ala_tva_claim:0 "The Current"
 la_ruina_ala_tva_claim_desc:0 "What the Authority did to one river, it claims it can do to the country."
 la_ruina_ala.16.t:0 "The Current"
 la_ruina_ala.16.d:0 "The Authority is not damming the Mississippi tomorrow. The claim is the grid. Every state still named ANARCHY is a river, a wire, or a town waiting on someone who kept the keys."
 la_ruina_ala.16.a:0 "The claim is written."

 la_ruina_ala_wrg_ring:0 "The Courthouse Ring"
 la_ruina_ala_wrg_ring_desc:0 "The judges, the sheriffs, and the cotton men never needed Montgomery. The courthouse was the capital."
 la_ruina_ala.17.t:0 "The Courthouse Ring"
 la_ruina_ala.17.d:0 "The judges, the sheriffs, and the cotton men never needed Montgomery. The courthouse was always the capital, and now they are saying so out loud."
 la_ruina_ala.17.a:0 "The ring is the government."

 la_ruina_ala_wrg_secure:0 "Hold the Belt"
 la_ruina_ala_wrg_secure_desc:0 "The counties of the Wiregrass answer to one ring instead of twenty."
 la_ruina_ala.18.t:0 "Hold the Belt"
 la_ruina_ala.18.d:0 "The counties of the Wiregrass have one ring instead of twenty. Cotton still moves, and it moves when the ring says so."
 la_ruina_ala.18.a:0 "The belt is held."

 la_ruina_ala_wrg_break:0 "Break Mobile"
 la_ruina_ala_wrg_break_desc:0 "The harbor merchants priced the cotton and called it trade. The ring has the counties."
 la_ruina_ala.19.t:0 "Break Mobile"
 la_ruina_ala.19.d:0 "The harbor merchants priced the cotton and called it trade. The ring has the counties, and the harbor is a county now."
 la_ruina_ala.19.a:0 "The harbor takes orders."

 la_ruina_ala_wrg_unify:0 "One Alabama"
 la_ruina_ala_wrg_unify_desc:0 "Every county in the state answers to the ring. The map can take a real name."
 la_ruina_ala.20.t:0 "The State of Alabama"
 la_ruina_ala.20.d:0 "The holds have stopped answering for themselves. The courthouses are the government. The name on the map is the State of Alabama."
 la_ruina_ala.20.a:0 "Alabama has a government."

 la_ruina_ala_wrg_claim:0 "Every Courthouse"
 la_ruina_ala_wrg_claim_desc:0 "Every state still in anarchy is a set of counties waiting on a courthouse."
 la_ruina_ala.21.t:0 "Every Courthouse"
 la_ruina_ala.21.d:0 "The ring is not swearing in sheriffs from Maine to California. The claim is the counties. Every state still named ANARCHY is a courthouse that has not picked a side."
 la_ruina_ala.21.a:0 "The claim is written."

 la_ruina_ala_mob_harbor:0 "The Harbor"
 la_ruina_ala_mob_harbor_desc:0 "Ships still come in. Whoever clears them has the money, and the money is Mobile."
 la_ruina_ala.22.t:0 "The Harbor"
 la_ruina_ala.22.d:0 "Ships still come in. Whoever clears them has the money, and whoever has the money has Mobile. The merchants have stopped pretending otherwise."
 la_ruina_ala.22.a:0 "The harbor speaks for itself."

 la_ruina_ala_mob_secure:0 "Hold the Docks"
 la_ruina_ala_mob_secure_desc:0 "The warehouses, the pilots, and the customs house answer to the harbor."
 la_ruina_ala.23.t:0 "Hold the Docks"
 la_ruina_ala.23.d:0 "The warehouses, the pilots, and the customs house answer to the harbor. Mobile is a port with one owner."
 la_ruina_ala.23.a:0 "The docks are held."

 la_ruina_ala_mob_break:0 "Break the Wiregrass"
 la_ruina_ala_mob_break_desc:0 "The cotton bosses needed the port more than the port needed them."
 la_ruina_ala.24.t:0 "Break the Wiregrass"
 la_ruina_ala.24.d:0 "The cotton bosses needed the port more than the port needed them. The road north is open, and the courthouses are quiet."
 la_ruina_ala.24.a:0 "The belt takes orders."

 la_ruina_ala_mob_unify:0 "One Alabama"
 la_ruina_ala_mob_unify_desc:0 "The harbor's money runs the state. The map can take a real name."
 la_ruina_ala.25.t:0 "The State of Alabama"
 la_ruina_ala.25.d:0 "The holds have stopped answering for themselves. The harbor clears for the state. The name on the map is the State of Alabama."
 la_ruina_ala.25.a:0 "Alabama has a government."

 la_ruina_ala_mob_claim:0 "The Gulf Door"
 la_ruina_ala_mob_claim_desc:0 "A port that holds Alabama holds a door onto every state that still has a coast."
 la_ruina_ala.26.t:0 "The Gulf Door"
 la_ruina_ala.26.d:0 "The merchants are not sailing a fleet at the rest of the country. The claim is the door. Every state still named ANARCHY has something that used to move through a port, and Mobile still has one."
 la_ruina_ala.26.a:0 "The claim is written."

 la_ruina_ala_mgm_claim_idea:0 "The Seal"
 la_ruina_ala_mgm_claim_idea_desc:0 "Montgomery holds the only seal in Alabama, and it is a claim on every state still named ANARCHY."
 la_ruina_ala_bhm_claim_idea:0 "Birmingham Steel"
 la_ruina_ala_bhm_claim_idea_desc:0 "The mills are back under one committee, and the state means to claim every plant still sitting in anarchy."
 la_ruina_ala_tva_claim_idea:0 "The Current"
 la_ruina_ala_tva_claim_idea_desc:0 "The Authority kept the lights on in one valley. The claim is every wire still dark."
 la_ruina_ala_wrg_claim_idea:0 "The Counties"
 la_ruina_ala_wrg_claim_idea_desc:0 "The ring holds Alabama's courthouses, and it claims every county that has not picked a government."
 la_ruina_ala_mob_claim_idea:0 "The Harbor"
 la_ruina_ala_mob_claim_idea_desc:0 "Mobile still clears ships. The claim is every state whose goods used to move through a port."
